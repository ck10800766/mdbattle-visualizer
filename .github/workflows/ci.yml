name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    name: Regression Tests & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Snapshot Regression Tests
        run: npm run test:snap

      - name: Build Userscript Bundle
        run: npm run build

      - name: Verify Bundle Is Up-to-date
        run: git diff --exit-code dist/
